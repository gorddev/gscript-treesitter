[package]
authors = [ "Gordon Novak <novak9@stolaf.edu>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "A small low-overhead scripting language used in a custom game engine."
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "gscript" ]
license = "MIT"
name = "tree-sitter-gscript"
readme = "README.md"
repository = "https://github.com/gorddev/gscript-treesitter.git"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
